spring.application.name=decodeio-backend

server.port=8080

# PostgreSQL connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/decodeio}
spring.datasource.username=${DB_USERNAME:decodeio_app}
spring.datasource.password=${DB_PASSWORD}

# Database configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false